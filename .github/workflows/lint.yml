name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v23.1.0
        with:
          globs: |
            **/*.md
            !node_modules/**
          config: .markdownlint.json

  yaml-frontmatter:
    name: SKILL.md YAML frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML frontmatter is parseable
        run: |
          for skill in skills/*/SKILL.md; do
            echo "Checking $skill"
            python3 - <<EOF
          import sys
          import yaml
          with open("$skill") as f:
              content = f.read()
          if not content.startswith("---"):
              print(f"  FAIL: $skill does not start with YAML frontmatter")
              sys.exit(1)
          end = content.index("---", 3)
          frontmatter = content[3:end].strip()
          try:
              data = yaml.safe_load(frontmatter)
          except yaml.YAMLError as e:
              print(f"  FAIL: $skill has invalid YAML frontmatter: {e}")
              sys.exit(1)
          required = ["name", "description", "when_to_use"]
          for r in required:
              if r not in data:
                  print(f"  FAIL: $skill missing required field: {r}")
                  sys.exit(1)
          combined = len(str(data["description"])) + len(str(data["when_to_use"]))
          if combined > 1536:
              print(f"  FAIL: $skill description + when_to_use is {combined} chars (Claude Code truncates the skill listing at 1536)")
              sys.exit(1)
          print(f"  OK: name={data['name']} description+when_to_use={combined} chars")
          EOF
          done

  python-helper:
    name: Validate secret_scan.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python3 -m py_compile skills/offensive-osint/scripts/secret_scan.py
      - name: Smoke test
        run: |
          # A GitHub classic PAT is ghp_ followed by exactly 36 characters.
          # Build the fixture at runtime so no PAT-shaped literal is committed.
          # The previous inline fixture had 37 characters, so GH_PAT_CLASSIC
          # never matched and nothing asserted on it.
          gh_fixture="ghp_$(printf 'a%.0s' {1..36})"

          printf '%s\n' \
            'AKIAIOSFODNN7EXAMPLE' \
            "$gh_fixture" \
            'eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c' | \
            python3 skills/offensive-osint/scripts/secret_scan.py | \
            tee /tmp/output.jsonl

          # Verify expected hits
          for pattern in AWS_ACCESS_KEY GH_PAT_CLASSIC JWT; do
            grep -q "\"$pattern\"" /tmp/output.jsonl || { echo "FAIL: $pattern not detected"; exit 1; }
          done
          echo "OK: secret_scan.py smoke test passed"

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          additional_files: install.sh uninstall.sh

  python-core-tests:
    name: Python core tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install base package
        run: python -m pip install -e .
      - name: Compile package, tests, MCP server, and tools
        run: python -m compileall outrider tests mcp-server tools
      - name: Run complete unit test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Benchmark harness smoke (deterministic, no network)
        run: python -m outrider benchmark run --tally-only

  web-control-tests:
    name: Web control-plane tests (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package with web extra
        run: python -m pip install -e ".[web,enrichment]"
      - name: Verify optional web dependencies
        run: python -c "import fastapi, httpx, uvicorn"
      - name: Compile package, tests, and tools
        run: python -m compileall outrider tests tools
      - name: Run focused web tests
        run: python -m unittest tests.test_web_view tests.test_web_app tests.test_workflow_guide tests.test_web_acceptance
      - name: Validate packaged JavaScript
        run: node --check outrider/web_static/app.js
      - name: Run web acceptance harness
        run: python tools/web_acceptance.py
      - name: Run complete unit test suite with web extra
        run: python -m unittest discover -s tests -p "test_*.py"

  release-readiness:
    name: Release readiness package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Run release audit
        run: python tools/release_audit.py
      - name: Build sdist and wheel
        run: |
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*
      - name: Inspect package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools')
          import release_audit
          for artifact in sorted(Path('dist').iterdir()):
              result = release_audit.inspect_archive(artifact)
              print(result)
              assert result['has_license']
              assert result['has_metadata']
              assert result['has_web_static']
              assert result['has_schemas']
              assert result['has_skill_catalog']
              assert not result['unexpected']
          PY
      - name: Clean base wheel installation smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys, tempfile, venv
          wheel = next(Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as td:
              env = Path(td) / 'base'
              venv.EnvBuilder(with_pip=True).create(env)
              py = env / 'bin' / 'python'
              subprocess.check_call([py, '-m', 'pip', 'install', str(wheel)])
              for args in [['outrider','--version'], ['outrider','--help'], ['outrider','init','--help'], ['outrider','show','--help'], ['outrider','scope-check','--help'], ['outrider','state','--help'], ['outrider','evidence','--help'], ['outrider','approval','--help'], ['outrider','action-check','--help'], ['outrider','contract','--help'], ['outrider','finding','--help'], ['outrider','web','--help'], ['outrider','orchestrate','--help'], ['outrider','verify','--help'], ['outrider','benchmark','--help']]:
                  subprocess.check_call([env / 'bin' / args[0], *args[1:]])
              # Proves the ground-truth corpus is packaged in the wheel and the loop runs offline.
              subprocess.check_call([env / 'bin' / 'outrider', 'benchmark', 'run', '--tally-only'])
              subprocess.check_call([py, '-c', 'import outrider, outrider.cli, outrider.orchestrator, outrider.verifier, outrider.benchmark; from outrider.skill_contract import list_known_skills; from outrider.package_resources import schema_json; assert len(list_known_skills()) == 11; assert schema_json("skill-request-v1.schema.json")["properties"]["schema_version"]["const"] == 1; import importlib.util; assert importlib.util.find_spec("fastapi") is None'])
          PY
      - name: Clean web wheel installation smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, tempfile, venv
          wheel = next(Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as td:
              env = Path(td) / 'web'
              venv.EnvBuilder(with_pip=True).create(env)
              py = env / 'bin' / 'python'
              subprocess.check_call([py, '-m', 'pip', 'install', f'{wheel}[web]'])
              import textwrap
              smoke = textwrap.dedent('''
                  from pathlib import Path
                  from tempfile import TemporaryDirectory
                  from fastapi.testclient import TestClient
                  from outrider.package_resources import web_static_path
                  from outrider.web_app import create_app
                  with TemporaryDirectory() as td:
                      runs_root = Path(td) / "runs"
                      runs_root.mkdir()
                      client = TestClient(create_app(runs_root, control_token="fixture"))
                      health = client.get("/api/health")
                      assert health.status_code == 200
                      assert health.json()["mode"] == "limited-control"
                      assert client.get("/api/session").status_code == 200
                      assert client.get("/").status_code == 200
                      assert client.get("/static/app.css").status_code == 200
                      assert client.get("/static/app.js").status_code == 200
                      assert web_static_path("index.html").exists()
                      assert health.json()["capabilities"]["guided_workflow"] is True
              ''')
              subprocess.check_call([py, '-c', smoke])
          PY
