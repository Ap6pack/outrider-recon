name: Publish to PyPI

# Publishes the Python wheel and sdist to PyPI using PyPI Trusted Publishing
# (OpenID Connect) — no API token or repository secret is used. The project is
# created on first publish via the registered pending publisher.
#
# Triggers:
#   - release: published  -> publishes the tagged release's distributions
#   - workflow_dispatch   -> manual run (used to publish an already-cut release,
#                            e.g. v4.0.0, whose release event already fired)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the ref that triggered this run
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/outrider-recon
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dists
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
