name: Unsigned release candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidates:
    name: Build unsigned release candidates
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Install local package with all optional extras
        run: |
          python -m pip install -e ".[web,enrichment,mcp]"
          python - <<'PY'
          import fastapi
          import httpx
          import uvicorn
          import mcp
          PY
      - name: Run release audit
        run: python tools/release_audit.py
      - name: Run release audit JSON mode
        run: python tools/release_audit.py --json
      - name: Run deterministic web acceptance harness
        run: |
          python tools/web_acceptance.py
          python tools/web_acceptance.py --json
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Python sources
        run: python -m compileall outrider tests mcp-server tools
      - name: Remove old build output safely
        run: rm -rf dist build *.egg-info
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check Python distributions
        run: python -m twine check dist/*
      - name: Build deterministic plugin/content bundle
        run: python tools/build_release_bundle.py --output-dir dist --source-date-epoch 1783987200
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum outrider_recon-0.3.0-py3-none-any.whl outrider_recon-0.3.0.tar.gz outrider-recon-bundle-3.1.0.zip | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Inspect archive contents
        run: |
          python -m zipfile -l dist/outrider-recon-bundle-3.1.0.zip
          python - <<'PY'
          import zipfile
          names=zipfile.ZipFile('dist/outrider-recon-bundle-3.1.0.zip').namelist()
          assert not any('/tests/' in n or '/.github/' in n or '__pycache__' in n for n in names)
          PY
      - name: Verify artifact version names
        run: |
          test -f dist/outrider_recon-0.3.0-py3-none-any.whl
          test -f dist/outrider_recon-0.3.0.tar.gz
          test -f dist/outrider-recon-bundle-3.1.0.zip
      - name: Clean base install smoke
        run: |
          python -m venv /tmp/outrider-base
          /tmp/outrider-base/bin/python -m pip install dist/outrider_recon-0.3.0-py3-none-any.whl
          /tmp/outrider-base/bin/outrider --version | grep '0.3.0'
          /tmp/outrider-base/bin/python -m outrider --version | grep '0.3.0'
      - name: Clean web install smoke
        run: |
          python -m venv /tmp/outrider-web
          /tmp/outrider-web/bin/python -m pip install "dist/outrider_recon-0.3.0-py3-none-any.whl[web]"
          /tmp/outrider-web/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from fastapi.testclient import TestClient
          from outrider.web_app import create_app

          with TemporaryDirectory() as temporary_directory:
              runs_root = Path(temporary_directory) / "runs"
              runs_root.mkdir()

              client = TestClient(create_app(runs_root, control_token="fixture"))
              headers = {"X-Outrider-Control-Token": "fixture"}

              health = client.get("/api/health")
              assert health.status_code == 200
              assert health.json()["capabilities"]["approval_mutation"] is True
              assert health.json()["capabilities"]["action_check"] is True
              assert health.json()["capabilities"]["guided_workflow"] is True
              assert health.json()["capabilities"]["automatic_discovery"] is False

              created = client.post("/api/runs", json={
                  "target": "example.com",
                  "actor": "authorized-operator",
                  "authorization_reference": "EXAMPLE-ROE-001",
                  "in_scope": ["example.com", "*.example.com"],
                  "out_of_scope": [],
              }, headers=headers)
              assert created.status_code == 201, created.text
              run_id = created.json()["run"]["run_id"]

              transitioned = client.post(f"/api/runs/{run_id}/state/transition", json={
                  "expected_state": "initialized",
                  "new_state": "scoped",
                  "actor": "authorized-operator",
                  "reason": None,
              }, headers=headers)
              assert transitioned.status_code == 200, transitioned.text

              approvals = client.get(f"/api/runs/{run_id}/approvals").json()
              revision = approvals["approval_revision"]

              grant = client.post(f"/api/runs/{run_id}/approvals", json={
                  "expected_revision": revision,
                  "expected_state": "scoped",
                  "action_type": "target_enumeration",
                  "candidate": "api.example.com",
                  "actor": "authorized-operator",
                  "reason": "Authorized DNS enumeration under ROE",
                  "duration_minutes": 30,
                  "conditions": None,
              }, headers=headers)
              assert grant.status_code == 201, grant.text
              approval_id = grant.json()["approval"]["approval_id"]
              revision = grant.json()["approvals"]["approval_revision"]

              allowed = client.post(f"/api/runs/{run_id}/action/check", json={
                  "action_type": "target_enumeration",
                  "candidate": "api.example.com",
              }, headers=headers)
              assert allowed.status_code == 200
              assert allowed.json()["decision"] == "allow"

              revoked = client.post(f"/api/runs/{run_id}/approvals/{approval_id}/revoke", json={
                  "expected_revision": revision,
                  "actor": "authorized-operator",
                  "reason": "Testing window closed",
              }, headers=headers)
              assert revoked.status_code == 200, revoked.text

              denied = client.post(f"/api/runs/{run_id}/action/check", json={
                  "action_type": "target_enumeration",
                  "candidate": "api.example.com",
              }, headers=headers)
              assert denied.status_code == 200
              assert denied.json()["decision"] == "deny"

              assert client.get("/").status_code == 200
              assert client.get("/static/app.css").status_code == 200
              assert client.get("/static/app.js").status_code == 200
              assert client.get(f"/api/runs/{run_id}/guide").status_code == 200
          PY

      - name: Clean enrichment install smoke
        run: |
          python -m venv /tmp/outrider-enrichment
          /tmp/outrider-enrichment/bin/python -m pip install "dist/outrider_recon-0.3.0-py3-none-any.whl[enrichment]"
          /tmp/outrider-enrichment/bin/python - <<'PY'
          import importlib.util
          import httpx
          import outrider.mcp_enrichment
          assert importlib.util.find_spec('fastapi') is None
          assert importlib.util.find_spec('uvicorn') is None
          assert importlib.util.find_spec('mcp') is None
          PY
      - name: Clean combined web enrichment install smoke
        run: |
          python -m venv /tmp/outrider-web-enrichment
          /tmp/outrider-web-enrichment/bin/python -m pip install "dist/outrider_recon-0.3.0-py3-none-any.whl[web,enrichment]"
          /tmp/outrider-web-enrichment/bin/python tools/web_acceptance.py --json
      - name: Clean MCP install smoke
        run: |
          python -m venv /tmp/outrider-mcp
          /tmp/outrider-mcp/bin/python -m pip install "dist/outrider_recon-0.3.0-py3-none-any.whl[mcp]"
          /tmp/outrider-mcp/bin/python - <<'PY'
          import httpx, mcp, importlib.util
          assert importlib.util.find_spec('httpx' + '2') is None
          import pathlib, runpy
          ns = runpy.run_path('mcp-server/server.py')
          for name in ['crtsh_lookup','hudsonrock_lookup','epss_score','wayback_urls','dns_records']:
              assert name in ns
          PY
      - name: Clean full optional install smoke
        run: |
          python -m venv /tmp/outrider-full
          /tmp/outrider-full/bin/python -m pip install "dist/outrider_recon-0.3.0-py3-none-any.whl[web,enrichment,mcp]"
          /tmp/outrider-full/bin/python - <<'PY'
          import fastapi, httpx, uvicorn, mcp
          import outrider.web_app, outrider.mcp_enrichment
          PY
      - name: Source-checkout MCP requirements smoke
        run: |
          python -m venv /tmp/outrider-mcp-req
          /tmp/outrider-mcp-req/bin/python -m pip install -r mcp-server/requirements.txt
          /tmp/outrider-mcp-req/bin/python - <<'PY'
          import httpx, mcp, outrider.mcp_enrichment
          PY
      - name: Extract and audit bundle
        run: |
          rm -rf /tmp/outrider-bundle-audit
          mkdir -p /tmp/outrider-bundle-audit
          python -m zipfile -e dist/outrider-recon-bundle-3.1.0.zip /tmp/outrider-bundle-audit
          python /tmp/outrider-bundle-audit/outrider-recon-bundle-3.1.0/tools/release_audit.py --root /tmp/outrider-bundle-audit/outrider-recon-bundle-3.1.0
      - name: Verify bundle manifest
        run: |
          python - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('dist/outrider-recon-bundle-3.1.0.zip') as z:
              m=json.loads(z.read('outrider-recon-bundle-3.1.0/RELEASE-MANIFEST.json'))
          assert m['python_version']=='0.3.0'
          assert m['plugin_version']=='3.1.0'
          assert m['skill_count']==11
          PY
      - name: Upload unsigned candidates
        uses: actions/upload-artifact@v4
        with:
          name: outrider-release-candidates-python-0.3.0-plugin-3.1.0
          path: |
            dist/outrider_recon-0.3.0-py3-none-any.whl
            dist/outrider_recon-0.3.0.tar.gz
            dist/outrider-recon-bundle-3.1.0.zip
            dist/SHA256SUMS
          retention-days: 7
