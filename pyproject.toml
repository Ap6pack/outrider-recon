[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outrider-recon"
version = "0.2.0"
description = "Claude-native external recon and ASM harness for prioritized, evidence-backed handoff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ap6pack" }
]
dependencies = [
  "PyYAML>=6",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
enrichment = [
  "httpx>=0.27,<1",
]
mcp = [
  "mcp",
  "httpx>=0.27,<1",
]

[project.scripts]
outrider = "outrider.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["outrider*"]

[tool.setuptools.package-data]
outrider = ["web_static/*", "skill_catalog.json", "schemas/*.json"]
